<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12101a" />
  <title>Uganda Weather</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #12101a;
      color: #f7f4ef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: calc(1rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .bg-map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      opacity: 0.5;
      filter: contrast(1.1) brightness(0.9);
      pointer-events: none;
    }
    .map-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(18, 16, 26, 0.55) 0%, rgba(18, 16, 26, 0.82) 100%);
      z-index: 1;
      pointer-events: none;
    }
    .content-area {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 320px;
      width: 100%;
    }
    .emblem {
      width: 92px;
      height: 92px;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.55));
    }
    .title {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 0.875rem;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .description {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(247, 244, 239, 0.78);
      margin-bottom: 1.875rem;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    }
    .retry-btn {
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #f7f4ef;
      padding: 0.75rem 2.25rem;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .retry-btn:active {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(0.97);
    }
  </style>
</head>

  <script>
    if (window.NativeSplash && typeof window.NativeSplash.hide === 'function') {
      window.NativeSplash.hide();
    }
    function retryConnection() {
      var origin = window.location.origin || "";
      if (
        (origin.indexOf("http://") === 0 || origin.indexOf("https://") === 0) &&
        (window.location.hostname !== "localhost" || Boolean(window.location.port))
      ) {
        window.location.href = origin + "/";
        return;
      }
      window.location.href = "https://hybrid.uganda-weather.com/";
    }
    window.addEventListener("online", function () {
      retryConnection();
    });
  </script>
