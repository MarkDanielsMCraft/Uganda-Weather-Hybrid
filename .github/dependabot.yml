version: 2

updates:
  # Web app and Capacitor packages. Checked daily so runtime fixes land quickly;
  # minor and patch updates are grouped to keep the number of pull requests small.
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      # Capacitor packages must stay on matching versions, so they always move together.
      capacitor:
        patterns:
          - "@capacitor/*"
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  # Android build tooling for the native app.
  - package-ecosystem: gradle
    directory: "/android"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      android-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
