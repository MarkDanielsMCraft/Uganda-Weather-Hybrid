name: Native apps

# Builds the Android and iOS shells and their home screen widgets on every change, so a
# native compile error is caught before release instead of on a phone.

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPACITOR_SERVER_URL: https://uganda-weather.com

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Capacitor 7 plugins compile with a Java 21 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm exec cap sync android

      - name: Build debug app and run unit tests
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/
          retention-days: 14

  ios:
    name: iOS build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec cap sync ios

      - name: Build app and widget for the simulator without signing
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
